<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f4f1" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0d0d10" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="같이 여행" />
  <title>여행계획짜기</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;700;900&family=Inter:wght@500;600;700;800&display=swap" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 선 아이콘 모음 -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-map" viewBox="0 0 24 24"><path d="M9 3 3 6v15l6-3 6 3 6-3V3l-6 3-6-3z"/><path d="M9 3v15M15 6v15"/></symbol>
      <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="4"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol>
      <symbol id="i-bed" viewBox="0 0 24 24"><path d="M2 4v16M2 8h17a3 3 0 0 1 3 3v9M2 17h20M6 8v9"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="m8 12 3 3 5-6"/></symbol>
      <symbol id="i-wallet" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="15" rx="4"/><path d="M16 12.5h2M2 9h20"/></symbol>
      <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 2 10 5-10 5L2 7z"/><path d="m2 17 10 5 10-5M2 12l10 5 10-5"/></symbol>
      <symbol id="i-locate" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></symbol>
      <symbol id="i-fit" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></symbol>
      <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
      <symbol id="i-nav" viewBox="0 0 24 24"><path d="m3 11 18-8-8 18-2-8z"/></symbol>
      <symbol id="i-route" viewBox="0 0 24 24"><circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="5" r="2.5"/><path d="M8.5 19H15a3.5 3.5 0 0 0 0-7H9a3.5 3.5 0 0 1 0-7h6.5"/></symbol>
      <symbol id="i-car" viewBox="0 0 24 24"><path d="M5 17h14M6 17v2M18 17v2M4 13l2-6h12l2 6v4H4z"/><circle cx="8" cy="14.5" r=".5"/><circle cx="16" cy="14.5" r=".5"/></symbol>
      <symbol id="i-ext" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
      <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
      <symbol id="i-ok" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
      <symbol id="i-book" viewBox="0 0 24 24"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5zM5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3"/><path d="M9 7h6"/></symbol>
      <symbol id="i-swap" viewBox="0 0 24 24"><path d="M7 4 3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/></symbol>
      <!-- 날씨 -->
      <symbol id="w-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
      <symbol id="w-psun" viewBox="0 0 24 24"><path d="M8 2.5v1.5M3.4 4.4l1 1M2 9h1.5M12.6 4.4l-1 1"/><path d="M5.2 11.3A4 4 0 1 1 11.9 7"/><path d="M8 20h9.5a3.5 3.5 0 0 0 .4-7 5 5 0 0 0-9.6 1.3A3 3 0 0 0 8 20z"/></symbol>
      <symbol id="w-cloud" viewBox="0 0 24 24"><path d="M7 19h10.5a4 4 0 0 0 .5-8 6 6 0 0 0-11.6 1.6A3.3 3.3 0 0 0 7 19z"/></symbol>
      <symbol id="w-rain" viewBox="0 0 24 24"><path d="M7 15h10.5a4 4 0 0 0 .5-8 6 6 0 0 0-11.6 1.6A3.3 3.3 0 0 0 7 15z"/><path d="M8 18l-1 3M12 18l-1 3M16 18l-1 3"/></symbol>
      <symbol id="w-snow" viewBox="0 0 24 24"><path d="M7 15h10.5a4 4 0 0 0 .5-8 6 6 0 0 0-11.6 1.6A3.3 3.3 0 0 0 7 15z"/><path d="M8 19h.01M12 21h.01M16 19h.01"/></symbol>
      <symbol id="w-fog" viewBox="0 0 24 24"><path d="M4 9h16M3 13h18M5 17h14"/></symbol>
      <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3.5 2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></symbol>
      <!-- 장소 분류 -->
      <symbol id="c-sight" viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 1 2-2h2l2-2h6l2 2h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.5"/></symbol>
      <symbol id="c-activity" viewBox="0 0 24 24"><path d="M3 9V6h18v3a3 3 0 0 0 0 6v3H3v-3a3 3 0 0 0 0-6z"/><path d="M14 6v12" stroke-dasharray="2 2"/></symbol>
      <symbol id="c-food" viewBox="0 0 24 24"><path d="M3 12h18a9 9 0 0 1-18 0zM7 8c0-2 2-2 2-4M12 8c0-2 2-2 2-4M17 8c0-2 2-2 2-4"/></symbol>
      <symbol id="c-cafe" viewBox="0 0 24 24"><path d="M4 8h13v6a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5zM17 10h1.5a2.5 2.5 0 0 1 0 5H17M8 3v2M12 3v2"/></symbol>
      <symbol id="c-shop" viewBox="0 0 24 24"><path d="M5 8h14l-1 13H6zM9 8V6a3 3 0 0 1 6 0v2"/></symbol>
      <symbol id="c-etc" viewBox="0 0 24 24"><path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></symbol>
      <symbol id="c-bed" viewBox="0 0 24 24"><path d="M2 5v15M2 9h17a3 3 0 0 1 3 3v8M2 17h20M6 9v8"/></symbol>
      <symbol id="c-plane" viewBox="0 0 24 24"><path d="M10 14 3 12l1-2 7 1 4-6h2l-2 7 5 1 1-2h2l-1 4 1 4h-2l-1-2-5 1 2 7h-2l-4-6z"/></symbol>
    </defs>
  </svg>

  <div id="app">
    <!-- 모바일: 상단 유리 바 + 떠 있는 하단 탭 / PC: 왼쪽 메뉴 -->
    <nav id="nav" class="nav" hidden>
      <a class="nav-brand" href="#/home" title="내 여행 목록">
        <img src="icon.svg" alt="" width="34" height="34" />
        <div>
          <strong><span id="tripName">여행</span> <em id="dday" class="dday"></em></strong>
          <small id="tripDates"></small>
        </div>
      </a>
      <div class="tabs">
        <a data-tab="map" href="#"><svg class="i"><use href="#i-map"/></svg><span>지도</span></a>
        <a data-tab="schedule" href="#"><svg class="i"><use href="#i-cal"/></svg><span>일정</span></a>
        <a data-tab="stay" href="#"><svg class="i"><use href="#i-bed"/></svg><span>숙소·교통</span></a>
        <a data-tab="checklist" href="#"><svg class="i"><use href="#i-check"/></svg><span>준비물</span></a>
        <a data-tab="expense" href="#"><svg class="i"><use href="#i-wallet"/></svg><span>지출</span></a>
        <a data-tab="links" href="#"><svg class="i"><use href="#i-book"/></svg><span>가이드</span></a>
      </div>
      <div class="topinfo" id="topInfo"></div>
      <div class="nav-foot">
        <button id="whoBtn" class="pill-btn" type="button"><svg class="i"><use href="#i-user"/></svg><span></span></button>
        <button id="shareBtn" class="pill-btn" type="button" aria-label="초대하기"><svg class="i"><use href="#i-link"/></svg><span class="lbl">초대하기</span></button>
        <small id="modeBadge"></small>
      </div>
    </nav>

    <main id="main">
      <section id="view-map" class="view" hidden>
        <div id="map"></div>
        <div id="pickBanner" class="pick-banner" hidden>
          📍 원하는 위치를 탭하세요 <button type="button" class="btn sm" id="pickCancel">취소</button>
        </div>
        <div class="daybar" id="dayBar"></div>
        <div class="map-tools">
          <button type="button" class="glass-btn" id="tileBtn" title="배경 지도"><svg class="i"><use href="#i-layers"/></svg></button>
          <button type="button" class="glass-btn" id="locBtn" title="내 위치"><svg class="i"><use href="#i-locate"/></svg></button>
          <button type="button" class="glass-btn" id="fitBtn" title="전체 보기"><svg class="i"><use href="#i-fit"/></svg></button>
        </div>
        <button type="button" class="fab" id="addPlaceBtn" aria-label="장소 추가"><svg class="i"><use href="#i-plus"/></svg></button>
        <aside id="sheet" class="sheet" data-snap="peek">
          <div class="sheet-handle" id="sheetHandle"><span></span></div>
          <div class="sheet-body" id="sheetBody"></div>
        </aside>
      </section>
      <section id="view-page" class="view page" hidden></section>
      <section id="view-landing" class="view page" hidden></section>
    </main>
  </div>

  <!-- 입력 폼 / 상세 (모바일: 아래에서 올라오는 시트, PC: 가운데 모달) -->
  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card" role="dialog" aria-modal="true">
      <header class="modal-head">
        <h2 id="modalTitle"></h2>
        <button type="button" class="icon-btn" data-close aria-label="닫기"><svg class="i"><use href="#i-x"/></svg></button>
      </header>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- 기사님께 보여주기 -->
  <div id="driver" class="driver" hidden>
    <button type="button" class="icon-btn" id="driverClose" aria-label="닫기"><svg class="i"><use href="#i-x"/></svg></button>
    <p class="driver-ask" id="driverAsk">师傅，请带我去这里</p>
    <h1 id="driverName"></h1>
    <p id="driverAddr"></p>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
